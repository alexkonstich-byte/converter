[project]
name = "converter"
version = "2.1.0"
description = "Универсальный конвертер картинок, аудио и видео (Material You)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "flet>=1.1.2,<2",
    "flet-audio>=1.1.2,<2",
    "flet-video>=1.1.2,<2",
    "flet-dropzone>=0.4.0",
    "Pillow>=11.2",
    "pillow-heif>=0.18",
    # no universal (arm64+x86_64) wheels for the macOS app build
    "rawpy>=0.21; sys_platform != 'darwin'",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

# `flet build windows|macos|linux` — packaged app with OS drag & drop.
[tool.flet]
org = "io.github.converter"
product = "Converter"
company = "converter"
copyright = "MIT"

[tool.flet.app]
path = "."
module = "app"
exclude = ["tests", ".github", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
