name: Build app

# Run manually from the Actions tab, or push a tag like v2.0.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv
      - name: Install Flet CLI
        run: pip install "flet[all]>=1.1.2,<2"
      - name: Build
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: flet build ${{ matrix.target }} --yes --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: converter-${{ matrix.target }}
          path: build/${{ matrix.target }}
